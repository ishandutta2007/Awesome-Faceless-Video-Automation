<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#111129" />
      <stop offset="100%" stop-color="#070712" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.6" />
    </linearGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .bg-glow-1 { animation: pulseGlow 6s ease-in-out infinite alternate; transform-origin: 20% 30%; }
      .bg-glow-2 { animation: pulseGlow 8s ease-in-out infinite alternate-reverse; transform-origin: 80% 70%; }
      .stream-line { stroke-dasharray: 10, 15; animation: streamFlow 4s linear infinite; }
      .tag-pill { animation: floatSlow 5s ease-in-out infinite; }
      .tag-pill-delay { animation: floatSlow 5s ease-in-out 2.5s infinite; }
      .live-dot { animation: badgePulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="260" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="258" x="1" y="1" rx="15" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Animated Ambient Glows (Behind Content) -->
  <circle cx="200" cy="80" r="180" fill="url(#glow1)" class="bg-glow-1" />
  <circle cx="980" cy="180" r="190" fill="url(#glow2)" class="bg-glow-2" />
  <circle cx="600" cy="130" r="160" fill="url(#glow3)" class="bg-glow-1" />

  <!-- Background Animated Cyber Grid / Tech Lines -->
  <g opacity="0.18">
    <line x1="100" y1="210" x2="1100" y2="210" stroke="#818cf8" stroke-width="1" />
    <line x1="100" y1="50" x2="1100" y2="50" stroke="#818cf8" stroke-width="1" />
    <path d="M 50,130 Q 300,40 600,130 T 1150,130" stroke="#06b6d4" stroke-width="1.5" fill="none" class="stream-line" />
    <path d="M 50,170 Q 400,240 700,170 T 1150,170" stroke="#ec4899" stroke-width="1.5" fill="none" class="stream-line" style="animation-direction: reverse;" />
  </g>

  <!-- Floating Ambient Pills in Background/Edges (Doesn't Obstruct Text) -->
  <g class="tag-pill" opacity="0.85">
    <rect x="80" y="32" width="120" height="26" rx="13" fill="#1e1e38" stroke="#38bdf8" stroke-width="1" />
    <circle cx="95" cy="45" r="4" fill="#38bdf8" class="live-dot" />
    <text x="108" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#bae6fd">AI PIPELINE</text>
  </g>

  <g class="tag-pill-delay" opacity="0.85">
    <rect x="1000" y="32" width="125" height="26" rx="13" fill="#1e1e38" stroke="#ec4899" stroke-width="1" />
    <circle cx="1015" cy="45" r="4" fill="#ec4899" class="live-dot" />
    <text x="1027" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#fbcfe8">AUTOPILOT</text>
  </g>

  <!-- Center Text Elements (Clean Foreground, High Contrast) -->
  <!-- Top Super-Header Badge -->
  <g>
    <rect x="470" y="32" width="260" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
    <circle cx="488" cy="46" r="4" fill="#10b981" class="live-dot" />
    <text x="502" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1.5">CURATED AWESOME LIST</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
    Awesome Faceless Video Automation
  </text>

  <!-- Subtitle -->
  <text x="600" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Top AI Video Generators, Open-Source Pipelines, Neural TTS &amp; Autonomous Shorts Factories
  </text>

  <!-- Tags / Capabilities Row -->
  <g transform="translate(600, 195)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#16172e" stroke="#2e3056" stroke-width="1" />
      <text x="80" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#93c5fd">⚡ Text-to-Video</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#16172e" stroke="#2e3056" stroke-width="1" />
      <text x="82" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#c084fc">🎙️ Neural Voiceover</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="175" height="28" rx="6" fill="#16172e" stroke="#2e3056" stroke-width="1" />
      <text x="87" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#f472b6">🎬 Dynamic Subtitles</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#16172e" stroke="#2e3056" stroke-width="1" />
      <text x="82" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#34d399">🚀 100% Automated</text>
    </g>
  </g>
</svg>
